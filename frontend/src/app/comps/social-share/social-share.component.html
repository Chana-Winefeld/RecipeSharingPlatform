<div class="share-container">
  <h3 class="share-title">שתפו את המתכון</h3>
  
  <div class="share-buttons">
    <button (click)="shareWhatsApp()" class="share-btn whatsapp" title="שתף ב-WhatsApp">
      <svg viewBox="0 0 24 24" class="icon">
        <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.544-.075-.173-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.395 0 .01 5.385.006 12.04c0 2.13.554 4.21 1.61 6.009L0 24l6.149-1.613a11.771 11.771 0 005.914 1.594h.005c6.654 0 12.032-5.384 12.037-12.041a11.77 11.77 0 00-3.489-8.492z"/>
      </svg>
      <span>WhatsApp</span>
    </button>

    <button (click)="shareFacebook()" class="share-btn facebook" title="שתף ב-Facebook">
      <svg viewBox="0 0 24 24" class="icon">
        <path fill="currentColor" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      <span>Facebook</span>
    </button>

    <button (click)="copyLink()" class="share-btn copy-link" [class.copied]="showCopied" title="העתק קישור">
      <svg viewBox="0 0 24 24" class="icon" *ngIf="!showCopied">
        <path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
      </svg>
      <svg viewBox="0 0 24 24" class="icon" *ngIf="showCopied">
        <path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
      <span>{{ showCopied ? 'הועתק!' : 'העתקת קישור' }}</span>
    </button>
  </div>
</div>
