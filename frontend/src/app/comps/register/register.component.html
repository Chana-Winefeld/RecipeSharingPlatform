<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <div class="logo-icon">👩‍🍳</div>
      <h2>הרשמה לקהילה</h2>
      <p class="subtitle">הצטרפו לאלפי בשלנים וחובבי קולינריה</p>
    </div>
    
    <div *ngIf="errorMessage" class="alert alert-danger">
       {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
       {{ successMessage }}
    </div>

    <form (ngSubmit)="onRegister()" autocomplete="off">
      <div class="form-group">
        <label for="username">שם משתמש</label>
        <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username" placeholder="איך תרצו להופיע באתר?" required [disabled]="isLoading">
      </div>

      <div class="form-group">
        <label for="email">כתובת אימייל</label>
        <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" placeholder="דואר אלקטרוני" required [disabled]="isLoading">
      </div>

      <div class="form-group">
        <label for="password">סיסמה</label>
        <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" placeholder="לפחות 6 תווים" required [disabled]="isLoading">
      </div>

      <div class="form-group">
        <label for="confirmPassword">אימות סיסמה</label>
        <input type="password" id="confirmPassword" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="הקלידו שוב את הסיסמה" required [disabled]="isLoading">
      </div>

      <button type="submit" class="btn-register" [disabled]="isLoading">
        <span *ngIf="!isLoading">יצירת חשבון</span>
        <span *ngIf="isLoading">אנא המתן...</span>
      </button>

      <div class="login-link">
        כבר יש לכם חשבון? <a routerLink="/login">להתחברות</a>
      </div>
    </form>
  </div>
</div>
