<div class="edit-profile-container">
  <div class="section-header">
    <h1 class="section-title">הגדרות פרופיל</h1>
    <div class="red-line"></div>
    <p class="subtitle">עדכנו את הפרטים האישיים והתמונה שלכם</p>
  </div>

  <div class="alerts-container">
    <div *ngIf="successMessage" class="alert-toast success">
      <span class="alert-icon">✅</span> {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert-toast danger">
      <span class="alert-icon">⚠️</span> {{ errorMessage }}
    </div>
  </div>

  <form (ngSubmit)="onSubmit()" class="profile-form card-styled">
    
    <div class="profile-image-section">
      <div class="image-preview-wrapper">
        <img 
          [src]="profileImagePreview || 'assets/no-image.png'" 
          alt="תמונת פרופיל"
          class="preview-img"
        >
        <label for="profileImageInput" class="upload-overlay">
          <span>📷 החלף תמונה</span>
        </label>
      </div>
      <input 
        type="file" 
        id="profileImageInput"
        (change)="onProfileImageSelected($event)"
        accept="image/*"
        class="hidden-input"
      >
      <div class="image-actions" *ngIf="selectedProfileImage">
        <button type="button" (click)="uploadProfileImage()" class="btn-confirm-upload" [disabled]="isUploadingImage">
          {{ isUploadingImage ? 'מעלה...' : 'אשר תמונה חדשה' }}
        </button>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>שם משתמש</label>
        <input 
          type="text" 
          [(ngModel)]="username" 
          name="username"
          placeholder="הכנס שם משתמש"
          required
        >
      </div>

      <div class="form-group">
        <label>אימייל</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="your@email.com"
          required
        >
      </div>
    </div>

    <div class="form-divider"><span>שינוי סיסמה (אופציונלי)</span></div>

    <div class="form-grid">
      <div class="form-group">
        <label>סיסמה חדשה</label>
        <input 
          type="password" 
          [(ngModel)]="newPassword" 
          name="newPassword"
          placeholder="לפחות 6 תווים"
        >
      </div>

      <div class="form-group">
        <label>אימות סיסמה</label>
        <input 
          type="password" 
          [(ngModel)]="confirmPassword" 
          name="confirmPassword"
          placeholder="הזינו שוב את הסיסמה"
        >
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-save" [disabled]="isSubmitting">
        {{ isSubmitting ? 'שומר שינויים...' : 'שמור הגדרות' }}
      </button>
      <button type="button" class="btn-cancel" routerLink="/recipes">ביטול</button>
    </div>
  </form>
</div>
